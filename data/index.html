<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JuaMaker 4WD Control</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --accent: #10b981;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            touch-action: pan-y; /* Prevent unwanted zooming on mobile */
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            padding: 30px 24px;
            box-sizing: border-box;
            border: 1px solid #334155;
        }

        h1 {
            text-align: center;
            color: var(--text-main);
            margin-top: 0;
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        h1::before {
            content: "🏎️";
            font-size: 1.8rem;
        }

        .tabs {
            display: flex;
            background: #0f172a;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            border-radius: 8px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .tab.active {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-template-rows: repeat(3, 80px);
            gap: 12px;
            justify-content: center;
            margin: 30px auto;
        }

        .btn-ctrl {
            background-color: #334155;
            color: var(--text-main);
            border: none;
            border-radius: 16px;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border-bottom: 4px solid #1e293b;
        }

        .btn-ctrl:active, .btn-ctrl.active-key {
            background-color: var(--primary);
            transform: translateY(4px);
            border-bottom-width: 0px;
            margin-top: 4px; /* Compensate for transform to keep layout stable */
            box-shadow: 0 0 15px var(--primary);
        }

        .btn-up { grid-column: 2; grid-row: 1; border-radius: 16px 16px 8px 8px; }
        .btn-left { grid-column: 1; grid-row: 2; border-radius: 16px 8px 8px 16px; }
        .btn-stop { 
            grid-column: 2; grid-row: 2; 
            background-color: var(--danger); 
            font-size: 14px; 
            font-weight: bold;
            border-radius: 50%;
            border-bottom: 4px solid #991b1b;
        }
        .btn-stop:active, .btn-stop.active-key { 
            background-color: var(--danger-hover); 
            box-shadow: 0 0 15px var(--danger);
        }
        .btn-right { grid-column: 3; grid-row: 2; border-radius: 8px 16px 16px 8px; }
        .btn-down { grid-column: 2; grid-row: 3; border-radius: 8px 8px 16px 16px; }

        .static-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="number"], select {
            padding: 12px;
            background: #1e293b;
            color: white;
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        
        input[type="number"]:focus, select:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px rgba(16, 185, 129, 0.2);
        }

        .btn-submit:hover {
            background-color: #059669;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(16, 185, 129, 0.3);
        }
        
        .btn-submit:active {
            transform: translateY(0);
        }

        .slider-container {
            margin-top: 30px;
            padding-top: 24px;
            border-top: 1px dashed #334155;
        }

        /* Custom Range Slider */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            background: #334155;
            border-radius: 4px;
            outline: none;
            margin-top: 12px;
            margin-bottom: 12px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
            transition: transform 0.1s;
        }
        
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .status-badge {
            background: #334155;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--text-main);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 0 auto;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--text-muted);
            transition: background-color 0.3s;
        }
        
        .status-dot.active {
            background-color: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }
        
        .status-wrapper {
            text-align: center;
            margin-top: 24px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>4WD JuaMaker</h1>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('free')">🕹️ Modo Livre</div>
        <div class="tab" onclick="switchTab('static')">⏱️ Sequência</div>
    </div>

    <!-- Free Mode Tab -->
    <div id="free-mode" class="tab-content active">
        <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 10px;">Toque na tela ou use <b>W A S D</b></p>
        <div class="d-pad">
            <button class="btn-ctrl btn-up" id="btn-w" onpointerdown="sendCommand('F', true)" onpointerup="sendCommand('S', false)" onpointerleave="sendCommand('S', false)" onpointercancel="sendCommand('S', false)">▲</button>
            <button class="btn-ctrl btn-left" id="btn-a" onpointerdown="sendCommand('L', true)" onpointerup="sendCommand('S', false)" onpointerleave="sendCommand('S', false)" onpointercancel="sendCommand('S', false)">◀</button>
            <button class="btn-ctrl btn-stop" onclick="sendCommand('S', false)">STOP</button>
            <button class="btn-ctrl btn-right" id="btn-d" onpointerdown="sendCommand('R', true)" onpointerup="sendCommand('S', false)" onpointerleave="sendCommand('S', false)" onpointercancel="sendCommand('S', false)">▶</button>
            <button class="btn-ctrl btn-down" id="btn-s" onpointerdown="sendCommand('B', true)" onpointerup="sendCommand('S', false)" onpointerleave="sendCommand('S', false)" onpointercancel="sendCommand('S', false)">▼</button>
        </div>
    </div>

    <!-- Static Mode Tab -->
    <div id="static-mode" class="tab-content">
        <div class="static-form">
            <div class="form-group">
                <label for="move-dir">Direção de Movimento</label>
                <select id="move-dir">
                    <option value="F">⬆️ Avançar (Frente)</option>
                    <option value="B">⬇️ Recuar (Trás)</option>
                    <option value="L">↩️ Curva Esquerda (50% int.)</option>
                    <option value="R">↪️ Curva Direita (50% int.)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="move-units">Unidades de Tempo (1 ud = 0.5s)</label>
                <input type="number" id="move-units" min="1" max="20" value="2">
            </div>
            <button class="btn-submit" onclick="sendStaticCommand()">🚀 Iniciar Movimento</button>
        </div>
    </div>

    <!-- Global Power Control -->
    <div class="slider-container form-group">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <label for="power-slider">⚡ Potência do Motor</label>
            <span style="font-weight: bold; color: var(--primary);"><span id="power-val">100</span>%</span>
        </div>
        <input type="range" id="power-slider" min="30" max="100" value="100" oninput="updatePowerDisplay(this.value)" onchange="sendPower()">
    </div>

    <div class="status-wrapper">
        <div class="status-badge" id="status-badge">
            <div class="status-dot" id="status-dot"></div>
            <span id="status-msg">Sistema Pronto</span>
        </div>
    </div>
</div>

<script>
    let currentPower = 100;
    const UNIT_TIME_MS = 500; // Time per unit in static mode
    let requestTimeout = null;

    // UI Feedback Functions
    function switchTab(tabId) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        if (tabId === 'free') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('free-mode').classList.add('active');
        } else {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('static-mode').classList.add('active');
        }
    }

    function updatePowerDisplay(val) {
        document.getElementById('power-val').innerText = val;
        currentPower = parseInt(val);
    }

    function setStatus(msg, isSuccess = true, isTranslent = false) {
        const dot = document.getElementById('status-dot');
        const text = document.getElementById('status-msg');
        
        text.innerText = msg;
        
        if (isSuccess) {
            dot.style.backgroundColor = 'var(--accent)';
            dot.style.boxShadow = '0 0 8px var(--accent)';
        } else {
            dot.style.backgroundColor = 'var(--danger)';
            dot.style.boxShadow = '0 0 8px var(--danger)';
        }

        // Return to neutral state after a brief moment for transient events
        if (isTranslent) {
            clearTimeout(requestTimeout);
            requestTimeout = setTimeout(() => {
                text.innerText = "Sistema Pronto";
                dot.style.backgroundColor = 'var(--text-muted)';
                dot.style.boxShadow = 'none';
            }, 1500);
        }
    }

    // Core Communication (Modern AJAX via Fetch)
    // Uses AbortController to prevent request piling if holding buttons
    let currentController = null;

    async function sendRequest(cmd, params = {}) {
        // Cancel previous pending request to ensure responsiveness
        if (currentController) {
            currentController.abort();
        }
        currentController = new AbortController();
        const signal = currentController.signal;

        let url = `/api/move?cmd=${cmd}`;
        for (let key in params) {
            url += `&${key}=${params[key]}`;
        }
        
        try {
            // Visual feedback that request started
            document.getElementById('status-dot').classList.add('active');
            
            // fetch is asynchronous and lighter than XMLHttpRequest
            const response = await fetch(url, { signal, method: 'GET' });
            
            if(!response.ok) throw new Error('HTTP ' + response.status);
            
            const text = await response.text();
            
            // Only update success message if it was a Stop command or Static
            if (cmd === 'S' || params.mode === 'static' || cmd === 'P') {
                 setStatus(`Comando aceito: ${cmd}`, true, true);
            } else {
                 setStatus(`Em movimento: ${cmd}`, true, false);
            }

        } catch (error) {
            if (error.name !== 'AbortError') {
                setStatus("Falha de conexão!", false, false);
                console.error("Fetch Error:", error);
            }
        }
    }

    // Command Wrappers
    function sendCommand(dir, isDown) {
        if (isDown) {
            sendRequest(dir, { power: currentPower, mode: 'free' });
        } else if (dir === 'S') {
            // When touch ends/mouse leaves, always send Stop
            sendRequest('S', { power: 0, mode: 'free' });
        }
    }

    function sendStaticCommand() {
        const dir = document.getElementById('move-dir').value;
        const units = document.getElementById('move-units').value;
        const duration = parseInt(units) * UNIT_TIME_MS;
        
        setStatus(`Agendado: ${dir} por ${duration}ms`, true, false);
        sendRequest(dir, { power: currentPower, mode: 'static', duration: duration });
    }

    function sendPower() {
         setStatus("Ajustando potência...", true, false);
         sendRequest('P', { power: currentPower });
    }

    // Keyboard bindings (WASD)
    const keysMap = {
        'w': { btnId: 'btn-w', cmd: 'F' },
        'a': { btnId: 'btn-a', cmd: 'L' },
        's': { btnId: 'btn-s', cmd: 'B' },
        'd': { btnId: 'btn-d', cmd: 'R' }
    };
    let activeKey = null;

    window.addEventListener('keydown', (e) => {
        // Prevent page scrolling for specific keys
        if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)){
             e.preventDefault();
        }

        const key = e.key.toLowerCase();
        
        // Prevent repeated triggers when holding down a key
        if (e.repeat) return;

        if (keysMap[key] && activeKey !== key) {
            if(activeKey) sendCommand('S', false); 
            
            activeKey = key;
            const map = keysMap[key];
            const btn = document.getElementById(map.btnId);
            if(btn) btn.classList.add('active-key');
            sendCommand(map.cmd, true);
        }
    });

    window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if (keysMap[key] && activeKey === key) {
            const btn = document.getElementById(keysMap[key].btnId);
            if(btn) btn.classList.remove('active-key');
            activeKey = null;
            sendCommand('S', false);
        }
    });
    
    // Prevent context menu holding on mobile to ensure pointerup fires
    window.oncontextmenu = function(event) {
        event.preventDefault();
        event.stopPropagation();
        return false;
    };

</script>
</body>
</html>
